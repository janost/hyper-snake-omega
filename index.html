<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🔥💥 HYPER SNAKE // APOCALYPSE SINGULARITY: MAXIMUM UNCHAINED OVERKILL 💥🔥</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Creepster&family=Press+Start+2P&family=Rubik+Glitch&family=Orbitron:wght@400;700;900&display=swap');

    :root {
      --neon-pink: #ff0055;
      --neon-cyan: #00ffff;
      --neon-lime: #00ff66;
      --neon-yellow: #ffee00;
      --neon-purple: #bd00ff;
      --neon-orange: #ff5500;
      --blood-red: #ff0033;
      --plasma-blue: #0088ff;
      --void-black: #000003;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--void-black);
      color: #fff;
      font-family: 'Orbitron', monospace, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1400px;
    }

    /* Strobes, hyper-flashes, screen tint overlay */
    #apocalypse-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: screen;
      opacity: 0;
      background: radial-gradient(circle, #fff 0%, #ff0055 40%, transparent 80%);
    }

    #super-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
      background: #fff;
      opacity: 0;
    }

    /* 3D Infinity Hyperspace Wormhole Grid */
    .space-warp-grid {
      position: fixed;
      inset: -100%;
      width: 300%;
      height: 300%;
      background-image: 
        radial-gradient(circle at center, transparent 0%, rgba(2,0,10,0.8) 70%),
        linear-gradient(rgba(0, 255, 255, 0.2) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255, 0, 128, 0.2) 2px, transparent 2px);
      background-size: 100% 100%, 60px 60px, 60px 60px;
      transform: perspective(400px) rotateX(75deg) translateY(-300px);
      animation: warpHyper 1.8s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes warpHyper {
      0% {
        background-position: 0 0, 0 0, 0 0;
      }
      100% {
        background-position: 0 0, 0 60px, 0 60px;
      }
    }

    /* Floating Hyper Neon Particle Canvas in body background */
    #bg-fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Extreme layout container */
    .master-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      max-width: 100vw;
      padding: 0.5rem;
      transform-style: preserve-3d;
    }

    /* Left Sidebar: Unlocked Achievements Tracker */
    .sidebar {
      width: 220px;
      height: 560px;
      background: rgba(10, 0, 25, 0.85);
      border: 2px solid var(--neon-cyan);
      border-radius: 14px;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(255, 0, 85, 0.2);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .sidebar-title {
      font-family: 'Black Ops One', cursive;
      font-size: 0.95rem;
      color: var(--neon-yellow);
      text-align: center;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--neon-yellow);
      border-bottom: 2px dashed rgba(255, 238, 0, 0.4);
      padding-bottom: 0.4rem;
    }

    .achievements-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .achievements-list::-webkit-scrollbar { display: none; }

    .achieve-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      font-size: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0.35;
      filter: grayscale(1);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .achieve-card.unlocked {
      opacity: 1;
      filter: grayscale(0);
      border-color: var(--neon-lime);
      background: rgba(0, 255, 102, 0.12);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
      animation: badgePop 0.4s ease;
    }

    @keyframes badgePop {
      0% { transform: scale(0.7); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .achieve-name {
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .achieve-card.unlocked .achieve-name { color: var(--neon-lime); }
    .achieve-desc { font-size: 0.55rem; color: #aaa; }

    /* Center game column */
    .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    /* Psycho header */
    .title-banner {
      font-family: 'Rubik Glitch', 'Black Ops One', cursive;
      font-size: 2.8rem;
      letter-spacing: 0.4rem;
      text-transform: uppercase;
      text-align: center;
      background: linear-gradient(180deg, #fff 0%, var(--neon-yellow) 25%, var(--neon-pink) 60%, var(--neon-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px #ff0055) drop-shadow(0 0 60px #00ffff);
      animation: hyperFlicker 0.25s infinite alternate;
      line-height: 1;
    }

    @keyframes hyperFlicker {
      0% { transform: skewX(-3deg) scale(1.02); filter: drop-shadow(0 0 35px #ff0055) hue-rotate(0deg); }
      50% { transform: skewX(3deg) scale(0.98); }
      100% { transform: skewX(0deg) scale(1.04); filter: drop-shadow(0 0 55px #00ffff) hue-rotate(90deg); }
    }

    /* Top HUD Row */
    .hud-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
      width: 560px;
    }

    .hud-cell {
      background: rgba(12, 0, 30, 0.85);
      border: 2px solid rgba(0, 255, 255, 0.4);
      border-radius: 10px;
      padding: 0.35rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.25);
      backdrop-filter: blur(8px);
    }

    .hud-cell.danger-glow {
      border-color: var(--blood-red) !important;
      box-shadow: 0 0 25px var(--blood-red), inset 0 0 15px var(--blood-red) !important;
      animation: redAlert 0.2s infinite alternate;
    }

    @keyframes redAlert {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.7); }
    }

    .hud-lbl {
      font-size: 0.55rem;
      letter-spacing: 2px;
      color: #00ffff;
      font-weight: 900;
      text-transform: uppercase;
    }

    .hud-val {
      font-family: 'Black Ops One', monospace;
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 12px #00ffff;
    }

    .gamepad-tag {
      font-size: 0.85rem;
      font-weight: 900;
      color: #666;
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }

    .gfx-btn {
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.5);
      color: var(--neon-cyan);
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      font-weight: 900;
      border-radius: 6px;
      padding: 0.25rem 0.4rem;
      margin-top: 0.2rem;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }
    .gfx-btn:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 10px var(--neon-cyan);
    }
    .gfx-btn.low {
      border-color: var(--neon-lime);
      color: var(--neon-lime);
    }
    .gfx-btn.low:hover {
      background: var(--neon-lime);
      color: #000;
      box-shadow: 0 0 10px var(--neon-lime);
    }

    /* Low graphics overrides for CSS animations / heavy elements */
    body.low-gfx .space-warp-grid {
      display: none !important;
    }
    body.low-gfx #bg-fx-canvas {
      display: none !important;
    }
    body.low-gfx .title-banner {
      animation: none !important;
      filter: none !important;
    }
    body.low-gfx #rig-container {
      animation: none !important;
      background: #1a0033 !important;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3) !important;
    }
    body.low-gfx .vignette-crt {
      display: none !important;
    }
    body.low-gfx .sidebar {
      backdrop-filter: none !important;
      box-shadow: none !important;
    }
    body.low-gfx .hud-cell {
      backdrop-filter: none !important;
      box-shadow: none !important;
    }
    body.low-gfx .hud-cell.danger-glow,
    body.low-gfx .achieve-card.unlocked,
    body.low-gfx .gamepad-tag.connected {
      animation: none !important;
    }

    /* Photosensitivity guard. The title flicker (4Hz), combo alert (5Hz) and the
       full-screen white flash all sit above the 3Hz seizure threshold, so they
       come off entirely when the OS asks for reduced motion. This is independent
       of the GFX toggle: it holds even if the player switches back to ULTRA. */
    @media (prefers-reduced-motion: reduce) {
      .space-warp-grid,
      #bg-fx-canvas,
      .vignette-crt,
      #super-flash,
      #apocalypse-overlay {
        display: none !important;
      }
      .title-banner,
      #rig-container,
      .hud-cell.danger-glow,
      .achieve-card.unlocked,
      .gamepad-tag.connected {
        animation: none !important;
      }
      .title-banner {
        filter: none !important;
      }
      #rig-container {
        background: #1a0033 !important;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.3) !important;
      }
      #screamer-text,
      #achievement-popup,
      .achieve-card {
        transition: none !important;
      }
    }

    .gamepad-tag.connected {
      color: var(--neon-lime);
      text-shadow: 0 0 10px var(--neon-lime);
      animation: padPulse 1s infinite alternate;
    }

    @keyframes padPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* Multi-tier Fever Mode Energy Bar */
    .fever-bar-wrap {
      width: 560px;
      height: 14px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid var(--neon-yellow);
      border-radius: 7px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 238, 0, 0.4);
    }

    .fever-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-lime), var(--neon-yellow), var(--neon-pink), #fff);
      background-size: 300% 100%;
      animation: rainbowLaser 0.5s linear infinite;
      box-shadow: 0 0 25px #ff0055;
    }

    @keyframes rainbowLaser {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .fever-text-indicator {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 4px #000, 0 0 10px #ff0055;
    }

    /* Viewport Frame with Insane Shaders & Borders */
    #rig-container {
      position: relative;
      padding: 8px;
      border-radius: 18px;
      background: linear-gradient(45deg, #ff0055, #bd00ff, #00ffff, #ffee00, #00ff66, #ff0055);
      background-size: 600% 600%;
      animation: borderSupernova 1.5s ease infinite;
      box-shadow: 
        0 0 60px rgba(255, 0, 85, 0.7),
        0 0 120px rgba(0, 255, 255, 0.4),
        inset 0 0 40px rgba(255, 255, 255, 0.7);
      transform-origin: center center;
    }

    @keyframes borderSupernova {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    canvas#game {
      display: block;
      background: #000;
      border-radius: 12px;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
    }

    /* Screen overlays */
    .vignette-crt {
      position: absolute;
      inset: 8px;
      border-radius: 12px;
      background: 
        radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 100%),
        linear-gradient(rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.5) 50%);
      background-size: 100% 100%, 100% 4px;
      pointer-events: none;
      z-index: 8;
    }

    /* Giant Voice/Announcer Overdrive Banner */
    #screamer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0) rotate(-15deg);
      font-family: 'Black Ops One', 'Creepster', cursive;
      font-size: 4rem;
      font-weight: 900;
      color: #fff;
      text-align: center;
      white-space: nowrap;
      text-shadow: 
        0 0 25px var(--neon-yellow),
        0 0 60px var(--neon-pink),
        0 0 100px var(--neon-cyan);
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.6), opacity 0.25s ease;
    }

    .screamer-active {
      transform: translate(-50%, -50%) scale(1.2) rotate(3deg) !important;
      opacity: 1 !important;
    }

    /* Achievement Pop-up Banner on the top-right */
    #achievement-popup {
      position: fixed;
      top: 25px;
      right: -400px;
      background: linear-gradient(90deg, #10002b, #240046);
      border: 2px solid var(--neon-yellow);
      border-radius: 12px;
      padding: 0.8rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 0 35px var(--neon-yellow), inset 0 0 15px rgba(255, 238, 0, 0.4);
      z-index: 100;
      transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #achievement-popup.show {
      right: 25px;
    }
    .pop-icon { font-size: 2.2rem; }
    .pop-info { display: flex; flex-direction: column; }
    .pop-tag { font-size: 0.65rem; color: var(--neon-yellow); font-weight: 900; letter-spacing: 2px; }
    .pop-title { font-size: 1.1rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px #fff; }

    /* Touch inputs */
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      width: 260px;
      margin-top: 0.4rem;
    }

    .touch-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid var(--neon-cyan);
      color: #fff;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1.6rem;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
      touch-action: manipulation;
    }
    .touch-btn:active {
      background: var(--neon-yellow);
      color: #000;
      box-shadow: 0 0 40px var(--neon-yellow);
    }
    .up { grid-column: 2; }
    .left { grid-column: 1; grid-row: 2; }
    .down { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }

    @media (max-width: 950px) {
      .sidebar { display: none; }
      .hud-grid { width: 100%; max-width: 480px; }
      .fever-bar-wrap { width: 100%; max-width: 480px; }
      canvas#game { width: 340px; height: 340px; }
      .title-banner { font-size: 2rem; }
    }

    @media (hover: none) and (pointer: coarse) {
      .touch-controls { display: grid; }
    }
  </style>
</head>
<body>
  <div class="space-warp-grid"></div>
  <canvas id="bg-fx-canvas"></canvas>
  <div id="apocalypse-overlay"></div>
  <div id="super-flash"></div>

  <!-- Achievement Notification popup -->
  <div id="achievement-popup">
    <div class="pop-icon" id="pop-icon">🏆</div>
    <div class="pop-info">
      <span class="pop-tag">⚡ TROPHY UNLOCKED ⚡</span>
      <span class="pop-title" id="pop-name">FIRST BLOOD</span>
    </div>
  </div>

  <div class="master-wrapper">
    <!-- Sidebar: Trophy Gallery -->
    <div class="sidebar">
      <div class="sidebar-title">🔥 ACHIEVEMENTS (<span id="achieve-count">0/25</span>)</div>
      <div class="achievements-list" id="achieve-list"></div>
    </div>

    <!-- Center Stage -->
    <div class="center-col">
      <div class="title-banner">HYPER SNAKE 🔥 SINGULARITY</div>

      <!-- Super HUD -->
      <div class="hud-grid">
        <div class="hud-cell">
          <span class="hud-lbl">SCORE</span>
          <span id="score" class="hud-val">0</span>
        </div>
        <div class="hud-cell" id="combo-cell">
          <span class="hud-lbl">COMBO</span>
          <span id="combo-val" class="hud-val" style="color: var(--neon-yellow);">1.0x</span>
        </div>
        <div class="hud-cell">
          <span class="hud-lbl">LENGTH</span>
          <span id="len-val" class="hud-val" style="color: var(--neon-lime);">5</span>
        </div>
        <div class="hud-cell">
          <span class="hud-lbl">HYPER SPEED</span>
          <span id="speed-val" class="hud-val" style="color: var(--neon-pink);">100%</span>
        </div>
        <div class="hud-cell">
          <span class="hud-lbl">BEST</span>
          <span id="best-val" class="hud-val" style="color: var(--neon-cyan);">0</span>
        </div>
        <div class="hud-cell">
          <span class="hud-lbl">PAD</span>
          <span id="pad-val" class="hud-val gamepad-tag">OFF</span>
        </div>
        <div class="hud-cell">
          <span class="hud-lbl">GFX</span>
          <button id="gfx-toggle" class="gfx-btn" title="Toggle Graphics Quality (High / Low)">ULTRA</button>
        </div>
      </div>

      <!-- FEVER / OVERDRIVE CHARGE BAR -->
      <div class="fever-bar-wrap">
        <div class="fever-fill" id="fever-fill"></div>
        <div class="fever-text-indicator" id="fever-txt">⚡ HYPER-DRIVE IDLE ⚡</div>
      </div>

      <!-- Game Canvas Rig -->
      <div id="rig-container">
        <div class="vignette-crt"></div>
        <div id="screamer-text">SINGULARITY!!</div>
        <canvas id="game" width="540" height="540"></canvas>
      </div>

      <!-- Touch Controls -->
      <div class="touch-controls">
        <button class="touch-btn up" data-key="ArrowUp">▲</button>
        <button class="touch-btn left" data-key="ArrowLeft">◀</button>
        <button class="touch-btn down" data-key="ArrowDown">▼</button>
        <button class="touch-btn right" data-key="ArrowRight">▶</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       0. PERSISTENCE HELPERS
       ========================================================================= */
    // localStorage throws in private mode / with cookies disabled, and can hold
    // garbage written by an older build. Neither should take the whole game down
    // before the canvas ever draws.
    function storageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }

    function storageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        /* not persistable in this context; the session still plays fine */
      }
    }

    // Assigning an unchanged textContent or style value still costs a style
    // invalidation. The HUD, the fever bar and the camera transform are all
    // written on every single frame and mostly don't change between them.
    const lastWrite = {};

    function writeText(el, key, value) {
      if (lastWrite[key] === value) return;
      lastWrite[key] = value;
      el.textContent = value;
    }

    function writeStyle(el, prop, key, value) {
      if (lastWrite[key] === value) return;
      lastWrite[key] = value;
      el.style[prop] = value;
    }

    function storageGetJSON(key, fallback) {
      const raw = storageGet(key);
      if (raw === null) return fallback;
      try {
        const parsed = JSON.parse(raw);
        return (parsed && typeof parsed === 'object') ? parsed : fallback;
      } catch (e) {
        return fallback;
      }
    }

    /* =========================================================================
       1. 150BPM PROCEDURAL DRUM & SYNTHWAVE / DUBSTEP AUDIO ENGINE (Web Audio)
       ========================================================================= */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    // Every voice routes through this rather than straight out, so stacked sounds
    // (nuke noise + sub + drums + bass) get limited instead of clipping.
    let masterBus = null;
    // One shared noise buffer for the snare and the nuke blast. Regenerating it
    // per hit churned ~6600 floats every 800ms for the life of the page.
    let noiseBuffer = null;

    function getNoiseBuffer() {
      if (!noiseBuffer) {
        const len = Math.floor(actx.sampleRate * 1.2);
        noiseBuffer = actx.createBuffer(1, len, actx.sampleRate);
        const d = noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      return noiseBuffer;
    }

    function initAudio() {
      if (!actx) {
        actx = new AudioContext();
        masterBus = actx.createGain();
        masterBus.gain.value = 0.8;
        const limiter = actx.createDynamicsCompressor();
        limiter.threshold.value = -6;
        limiter.knee.value = 6;
        limiter.ratio.value = 12;
        limiter.attack.value = 0.003;
        limiter.release.value = 0.15;
        masterBus.connect(limiter);
        limiter.connect(actx.destination);
        startSynthSoundtrack();
      }
      if (actx.state === 'suspended') actx.resume();
    }

    let musicTimer = null;
    let musicBeat = 0;
    // Hardstyle / Darksynth Bassline progression
    // F1, F1, G#1, A#1, F1, C2, D#2, F2
    const synthNotes = [43.65, 43.65, 51.91, 58.27, 43.65, 65.41, 77.78, 87.31];

    function startSynthSoundtrack() {
      if (musicTimer) return;
      const bpm = 150;
      const intervalMs = (60 / bpm / 4) * 1000; // 16th notes

      musicTimer = setInterval(() => {
        if (!actx || !gameStarted || gameOver) return;
        const t = actx.currentTime;

        // Kick on every quarter note (step 0, 4, 8, 12)
        if (musicBeat % 4 === 0) {
          const kickOsc = actx.createOscillator();
          const kickGain = actx.createGain();
          kickOsc.type = 'sine';
          kickOsc.frequency.setValueAtTime(140, t);
          kickOsc.frequency.exponentialRampToValueAtTime(35, t + 0.12);
          kickGain.gain.setValueAtTime(feverActive ? 0.6 : 0.4, t);
          kickGain.gain.linearRampToValueAtTime(0.001, t + 0.14);
          kickOsc.connect(kickGain);
          kickGain.connect(masterBus);
          kickOsc.start(t);
          kickOsc.stop(t + 0.14);
        }

        // Snare / Clap on step 4 & 12
        if (musicBeat % 8 === 4) {
          const noiseSrc = actx.createBufferSource();
          noiseSrc.buffer = getNoiseBuffer();
          const filter = actx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(1000, t);
          const noiseGain = actx.createGain();
          noiseGain.gain.setValueAtTime(0.09, t);
          noiseGain.gain.linearRampToValueAtTime(0.001, t + 0.15);
          noiseSrc.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(masterBus);
          noiseSrc.start(t);
          noiseSrc.stop(t + 0.15);
        }

        // Heavy Rolling Acid Bass
        if (musicBeat % 2 === 0) {
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          const flt = actx.createBiquadFilter();

          osc.type = feverActive ? 'sawtooth' : 'square';
          const rootFreq = synthNotes[(Math.floor(musicBeat / 4)) % synthNotes.length];
          const oct = feverActive ? 2 : 1;
          osc.frequency.setValueAtTime(rootFreq * oct, t);

          flt.type = 'lowpass';
          flt.Q.setValueAtTime(feverActive ? 8 : 4, t);
          flt.frequency.setValueAtTime(feverActive ? 3000 : 800, t);
          flt.frequency.exponentialRampToValueAtTime(100, t + 0.15);

          gain.gain.setValueAtTime(0.2, t);
          gain.gain.linearRampToValueAtTime(0.001, t + 0.15);

          osc.connect(flt);
          flt.connect(gain);
          gain.connect(masterBus);
          osc.start(t);
          osc.stop(t + 0.15);
        }

        musicBeat++;
      }, intervalMs);
    }

          o.start(t + i * 0.07);
          o.stop(t + i * 0.07 + 0.15);

    function rumbleGamepad(duration = 150, weak = 0.5, strong = 0.5) {
      if (!navigator.getGamepads) return;
      const gamepads = navigator.getGamepads();
      for (let i = 0; i < gamepads.length; i++) {
        const gp = gamepads[i];
        if (gp && gp.vibrationActuator && gp.vibrationActuator.playEffect) {
          gp.vibrationActuator.playEffect('dual-rumble', {
            startDelay: 0,
            duration: duration,
            weakMagnitude: Math.min(1, weak),
            strongMagnitude: Math.min(1, strong)
          }).catch(() => {});
        } else if (gp && gp.hapticActuators && gp.hapticActuators[0] && gp.hapticActuators[0].pulse) {
          gp.hapticActuators[0].pulse(strong, duration).catch(() => {});
        }
      }
    }

    /* =========================================================================

    const STICK_DEADZONE = 0.35;

    let prevPadAxes = { x: 0, y: 0 };

    function pollGamepads() {
      if (!navigator.getGamepads) return;
      const gamepads = navigator.getGamepads();
      let activePad = null;

      for (let i = 0; i < gamepads.length; i++) {
        if (gamepads[i] && gamepads[i].connected) {
          activePad = gamepads[i];
          break;
        }
      }

      if (activePad) {
        writeText(padEl, 'pad', 'PAD 1');
        padEl.classList.add('connected');
        unlockAchievement('pad_warrior');

        const b = activePad.buttons;
        const axes = activePad.axes;

        // Button press helper with rising-edge latching
        const isPressed = (idx) => b[idx] && (b[idx].pressed || b[idx].value > 0.5);
        const wasPressed = (idx) => !!prevPadButtons[idx];

        // Standard Xbox Mapping:
        // D-Pad: 12 (Up), 13 (Down), 14 (Left), 15 (Right)
        // Face buttons: 0 (A), 1 (B), 2 (X), 3 (Y), 9 (Start), 8 (Back/View)
        // Left Stick: Axes 0 (X), Axes 1 (Y)
        // Right Stick: Axes 2 (X), Axes 3 (Y)

        let targetDir = null;

        // D-Pad checks (rising edge)
        if (isPressed(12) && !wasPressed(12)) targetDir = 'ArrowUp';
        else if (isPressed(13) && !wasPressed(13)) targetDir = 'ArrowDown';
        else if (isPressed(14) && !wasPressed(14)) targetDir = 'ArrowLeft';
        else if (isPressed(15) && !wasPressed(15)) targetDir = 'ArrowRight';

        // Left Thumbstick checks with deadzone latching
        const stickX = axes[0] !== undefined ? axes[0] : 0;
        const stickY = axes[1] !== undefined ? axes[1] : 0;

        if (Math.abs(stickX) > STICK_DEADZONE || Math.abs(stickY) > STICK_DEADZONE) {
          if (Math.abs(stickX) > Math.abs(stickY)) {
            if (stickX > STICK_DEADZONE && prevPadAxes.x <= STICK_DEADZONE) targetDir = 'ArrowRight';
            else if (stickX < -STICK_DEADZONE && prevPadAxes.x >= -STICK_DEADZONE) targetDir = 'ArrowLeft';
          } else {
            if (stickY > STICK_DEADZONE && prevPadAxes.y <= STICK_DEADZONE) targetDir = 'ArrowDown';
            else if (stickY < -STICK_DEADZONE && prevPadAxes.y >= -STICK_DEADZONE) targetDir = 'ArrowUp';
          }
        }

        prevPadAxes.x = stickX;
        prevPadAxes.y = stickY;

        // Start / A / X button to start or respawn
        if ((isPressed(0) && !wasPressed(0)) || (isPressed(9) && !wasPressed(9)) || (isPressed(2) && !wasPressed(2))) {
          if (gameOver || !gameStarted) {

        }

        writeText(padEl, 'pad', 'OFF');
        padEl.classList.remove('connected');
      }
    }

    const GLOW_SPRITE_SIZE = 64;
    const glowSprites = new Map();

    function getGlowSprite(color) {
      let sprite = glowSprites.get(color);

      sprite.width = GLOW_SPRITE_SIZE;
      sprite.height = GLOW_SPRITE_SIZE;
      const sctx = sprite.getContext('2d');
      const c = GLOW_SPRITE_SIZE / 2;
      const grad = sctx.createRadialGradient(c, c, 0, c, c, c);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.22, color);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      sctx.fillStyle = grad;
      sctx.fillRect(0, 0, GLOW_SPRITE_SIZE, GLOW_SPRITE_SIZE);

      glowSprites.set(color, sprite);
      return sprite;
    }

    let chromaticAberration = 0;
    let cameraZoom = 1;
    let cameraRotate = 0;
    let flashIntensity = 0;
    let rainbowHue = 0;
    let lastTick = 0;
    let lastFrame = 0;
    const FRAME_MS = 1000 / 60;   // every FX constant below was tuned at 60fps
    const MAX_FRAME_MS = 100;     // clamp so a backgrounded tab doesn't jump on return

    bestEl.textContent = highScore;

    function resetGame() {
      deathTimers.forEach(clearTimeout);
      deathTimers = [];

      // Death leaves the camera mid-shake at zoom 1.3 / rotate 0.3; without this
      // the fresh game starts inside the old explosion.
      run = newRun();

      screenShake = 0;
      flashIntensity = 0;
      cameraZoom = 1;
      cameraRotate = 0;
      lastTick = performance.now();

      snake = [
        { x: 10, y: 10 },
        { x: 10, y: 11 },
        { x: 10, y: 12 },
        { x: 10, y: 13 },
        { x: 10, y: 14 }
      ];
      direction = { x: 0, y: -1 };
      nextDirection = { x: 0, y: -1 };
      score = 0;
      combo = 0;
      feverEnergy = 0;
      feverActive = false;
      scoreEl.textContent = '0';
      comboEl.textContent = '1.0x';
      lenEl.textContent = '5';
      speedEl.textContent = '100%';
      gameOver = false;
      gameStarted = false;

      particles = [];
      shockwaves = [];
      floatingTexts = [];
      lightningBolts = [];
      cosmicLasers = [];
      foods = [];

      spawnFood('normal');
      spawnFood('super');
      spawnFood('nuke');
      comboCell.classList.remove('danger-glow');
    }

    function spawnFood(forcedType = null) {
      if (foods.length >= 5) return;

      // Rejection sampling is cheap while the board is mostly empty, but it never
      // terminates once the snake fills it. Bail to an explicit free-cell list.
      const occupied = new Set();
      snake.forEach(s => occupied.add(s.y * TILE_COUNT + s.x));
      foods.forEach(f => occupied.add(f.y * TILE_COUNT + f.x));
      if (occupied.size >= TILE_COUNT * TILE_COUNT) return;

      let pos = null;
      for (let attempt = 0; attempt < 60; attempt++) {
        const x = Math.floor(Math.random() * TILE_COUNT);
        const y = Math.floor(Math.random() * TILE_COUNT);
        if (!occupied.has(y * TILE_COUNT + x)) {
          pos = { x, y };
          break;
        }
      }
      if (!pos) {
        const free = [];
        for (let i = 0; i < TILE_COUNT * TILE_COUNT; i++) {
          if (!occupied.has(i)) free.push(i);
        }
        const cell = free[Math.floor(Math.random() * free.length)];
        pos = { x: cell % TILE_COUNT, y: Math.floor(cell / TILE_COUNT) };
      }

      const roll = Math.random();
      let type = forcedType;
      if (!type) {
        if (roll < 0.15) type = 'blackhole';
        else if (roll < 0.35) type = 'nuke';
        else if (roll < 0.60) type = 'laser';
        else if (roll < 0.80) type = 'super';
        else type = 'normal';
      }

      foods.push({
        x: pos.x,
        y: pos.y,
        type: type,
        phase: Math.random() * Math.PI * 2,
        born: performance.now()
      });

      // Spawn portal entry particles
      if (!lowGraphics) {
        const px = pos.x * GRID_SIZE + GRID_SIZE / 2;
        const py = pos.y * GRID_SIZE + GRID_SIZE / 2;
        for (let i = 0; i < 20; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = Math.random() * 5 + 2;
          particles.push({
            x: px, y: py,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 1.0,
            decay: 0.03,
            color: getFoodColor(type),
            size: Math.random() * 5 + 2
          });
        }
      }
    }

    function getFoodColor(type) {
      switch (type) {
        case 'nuke': return '#ff0033';
        case 'blackhole': return '#bd00ff';
        case 'laser': return '#00ffff';
        case 'super': return '#ffee00';
        default: return '#00ff66';
      }
    }

    function triggerScreamer(text, color = '#fff') {
      screamer.textContent = text;
      screamer.style.color = color;
      screamer.classList.add('screamer-active');
      setTimeout(() => screamer.classList.remove('screamer-active'), 850);
    }

    function triggerLightning(x1, y1, x2, y2, color = '#00ffff') {
      if (lowGraphics) return;
      const segments = [];
      let cx = x1, cy = y1;
      const steps = 7;
      for (let i = 0; i < steps; i++) {
        const tx = x1 + ((x2 - x1) / steps) * (i + 1);
        const ty = y1 + ((y2 - y1) / steps) * (i + 1);
        const jx = (Math.random() - 0.5) * 50;
        const jy = (Math.random() - 0.5) * 50;
        segments.push({ x1: cx, y1: cy, x2: tx + jx, y2: ty + jy });
        cx = tx + jx;
        cy = ty + jy;
      }
      lightningBolts.push({ segments, life: 1.0, color });
    }

    function spawnHyperExplosion(x, y, count, colors, speedMultiplier = 1) {
      if (lowGraphics) return;
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = (Math.random() * 12 + 3) * speedMultiplier;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 1.0,
          decay: Math.random() * 0.02 + 0.015,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 8 + 3
        });
      }
    }

    function addShockwave(x, y, color, maxRadius = 180) {
      if (lowGraphics) return;
      shockwaves.push({ x, y, radius: 10, maxRadius, opacity: 1, color });
    }

    function addFloatingText(text, x, y, color, scale = 1.2) {
      floatingTexts.push({
        text, x, y,
        vy: -3.5,
        life: 1.0,
        decay: 0.016,
        color,
        scale
      });
    }

    /* =========================================================================
       5. GAME LOOP LOGIC TICK
       ========================================================================= */
    function updateLogic() {
      if (!gameStarted || gameOver) return;

      direction = { ...nextDirection };
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      // Wall Wrapping in FEVER MODE, or Fatal Crash in Normal Mode
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        if (feverActive) {
          // Warp through walls during fever
          head.x = (head.x + TILE_COUNT) % TILE_COUNT;
          head.y = (head.y + TILE_COUNT) % TILE_COUNT;
          unlockAchievement('phase_shifter');
          triggerLightning(snake[0].x * GRID_SIZE, snake[0].y * GRID_SIZE, head.x * GRID_SIZE, head.y * GRID_SIZE, '#ffee00');
        } else {
          annihilateSnake('WALL IMPACT FATALITY');
          return;
        }
      }

      // Self Collision Check (Immune during fever). The final segment is skipped
      // because it vacates on this same tick. Food never spawns on the snake, so
      // the grow case can't land on the tail either.
      for (let i = 0; i < snake.length - 1; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          if (!feverActive) {
            annihilateSnake('OUROBOROS SELF DESTRUCTION');
            return;
          }
        }
      }

      snake.unshift(head);
      lenEl.textContent = snake.length;

      // Check achievement for length
      if (snake.length >= 25) unlockAchievement('long_boi');
      if (snake.length >= 40) unlockAchievement('titan_len');
      if (snake.length >= 60) unlockAchievement('leviathan');

      // Check Food Collisions
      let eatenIdx = -1;
      for (let i = 0; i < foods.length; i++) {
        if (head.x === foods[i].x && head.y === foods[i].y) {
          eatenIdx = i;
          break;
        }
      }

      if (eatenIdx !== -1) {
        const eaten = foods[eatenIdx];
        foods.splice(eatenIdx, 1);

        unlockAchievement('first_blood');

        combo++;
        lastEatTimestamp = performance.now();
        const mult = 1 + (combo - 1) * 0.5 + (feverActive ? 2.0 : 0);
        comboEl.textContent = mult.toFixed(1) + 'x';
        comboCell.classList.add('danger-glow');

        if (combo >= 5) unlockAchievement('combo_5');
        if (combo >= 10) unlockAchievement('combo_10');
        if (combo >= 20) unlockAchievement('combo_20');

        run.eaten.add(eaten.type);
        if (FOOD_TYPES.every(t => run.eaten.has(t))) unlockAchievement('balanced_diet');

        // Charge Fever Gauge
        if (!feverActive) {
          feverEnergy = Math.min(100, feverEnergy + (eaten.type === 'nuke' || eaten.type === 'blackhole' ? 35 : 18));
          if (feverEnergy >= 100) {
            activateFeverMode();
          }
        }

        const hx = head.x * GRID_SIZE + GRID_SIZE / 2;
        const hy = head.y * GRID_SIZE + GRID_SIZE / 2;

        let basePoints = 10;

        // FOOD TYPE SPECIAL DISASTERS
        if (eaten.type === 'blackhole') {
          unlockAchievement('singularity');
          if (++run.blackholes >= 3) unlockAchievement('event_horizon');
          playExtremeSound('eat_blackhole');
          basePoints = 150;
          screenShake = 45;
          cameraZoom = 1.25;
          flashIntensity = 0.9;
          rumbleGamepad(450, 0.7, 1.0);
          spawnHyperExplosion(hx, hy, 140, ['#bd00ff', '#00ffff', '#fff', '#ff00ff'], 1.5);
          addShockwave(hx, hy, '#bd00ff', 350);
          addFloatingText(`🌌 BLACK HOLE +${Math.round(basePoints * mult)}!`, hx, hy - 25, '#bd00ff', 2.2);
          triggerScreamer('COSMIC SINGULARITY!!', '#bd00ff');

          // Pull all remaining foods into player mouth
          foods.forEach(f => {
            triggerLightning(hx, hy, f.x * GRID_SIZE + GRID_SIZE/2, f.y * GRID_SIZE + GRID_SIZE/2, '#bd00ff');
          });

        } else if (eaten.type === 'nuke') {
          unlockAchievement('nuke_master');
          if (++run.nukes >= 3) unlockAchievement('fallout');
          playExtremeSound('eat_nuke');
          basePoints = 100;
          screenShake = 55;
          cameraRotate = (Math.random() - 0.5) * 0.25;
          cameraZoom = 1.2;
          flashIntensity = 1.0;
          rumbleGamepad(600, 1.0, 1.0);
          spawnHyperExplosion(hx, hy, 160, ['#ff0033', '#ffee00', '#fff', '#ff5500'], 1.8);
          addShockwave(hx, hy, '#ff0033', 400);
          addFloatingText(`☢️ NUCLEAR OVERKILL +${Math.round(basePoints * mult)}!`, hx, hy - 25, '#ff0033', 2.4);
          triggerScreamer('💥 APOCALYPTIC NUKE 💥', '#ff0033');

          // Arc 4 corners
          triggerLightning(hx, hy, 0, 0, '#ff0033');
          triggerLightning(hx, hy, canvas.width, 0, '#ff0033');
          triggerLightning(hx, hy, 0, canvas.height, '#ff0033');
          triggerLightning(hx, hy, canvas.width, canvas.height, '#ff0033');

        } else if (eaten.type === 'laser') {
          if (++run.lasers >= 5) unlockAchievement('beam_architect');
          playExtremeSound('eat_laser');
          basePoints = 60;
          screenShake = 25;
          rumbleGamepad(180, 0.6, 0.3);
          spawnHyperExplosion(hx, hy, 70, ['#00ffff', '#fff', '#0088ff']);
          addShockwave(hx, hy, '#00ffff', 220);
          addFloatingText(`⚡ LASER BURST +${Math.round(basePoints * mult)}!`, hx, hy - 20, '#00ffff', 1.8);

          // Fire cross laser beams along whole row & col. Full-canvas beams with
          // shadowBlur are the single most expensive effect here, so LOW skips them.
          if (!lowGraphics) cosmicLasers.push({ x: hx, y: hy, life: 1.0, color: '#00ffff' });

        } else if (eaten.type === 'super') {
          playExtremeSound('eat_laser');
          basePoints = 40;
          screenShake = 20;
          rumbleGamepad(140, 0.5, 0.4);
          spawnHyperExplosion(hx, hy, 60, ['#ffee00', '#ff0055', '#fff']);
          addShockwave(hx, hy, '#ffee00', 200);
          addFloatingText(`⭐ HYPER STAR +${Math.round(basePoints * mult)}!`, hx, hy - 15, '#ffee00', 1.6);

        } else {
          playExtremeSound('eat_normal');
          screenShake = 12;
          rumbleGamepad(70, 0.3, 0.1);
          spawnHyperExplosion(hx, hy, 35, ['#00ff66', '#00ffff', '#fff']);
          addShockwave(hx, hy, '#00ff66', 130);
          addFloatingText(`+${Math.round(basePoints * mult)}`, hx, hy - 10, '#00ff66', 1.3);
        }

        const gained = Math.round(basePoints * mult);
        score += gained;
        scoreEl.textContent = score;

        if (score >= 1000) unlockAchievement('score_1k');
        if (score >= 3000) unlockAchievement('score_3k');
        if (score >= 10000) unlockAchievement('score_10k');
        // Fever is the easy way to a big score; this is the reward for not using it.
        if (score >= 1000 && run.fevers === 0) unlockAchievement('cold_blooded');

        if (score > highScore) {
          highScore = score;
          bestEl.textContent = highScore;
          storageSet('hyper_snake_omega_hi', highScore);
        }

        // Keep 3 to 4 foods on screen
        spawnFood();
        if (foods.length < 3) spawnFood();
        if (Math.random() < 0.3) spawnFood();

      } else {
        snake.pop();
      }
    }

    function activateFeverMode() {
      feverActive = true;
      feverTimeLeft = feverDuration;
      unlockAchievement('fever_starter');
      if (++run.fevers >= 3) unlockAchievement('perpetual');
      playExtremeSound('fever_activate');
      triggerScreamer('⚡ RAINBOW FEVER ⚡', '#ffee00');
      screenShake = 50;
      flashIntensity = 0.8;
      rumbleGamepad(400, 0.8, 0.8);
    }

    function annihilateSnake(reason) {
      gameOver = true;
      playExtremeSound('eat_nuke');
      screenShake = 80;
      flashIntensity = 1.0;
      cameraZoom = 1.3;
      cameraRotate = 0.3;
      triggerScreamer('💀 CRITICAL DESTRUCTION 💀', '#ff0033');
      rumbleGamepad(800, 1.0, 1.0);

      // Sequentially vaporize every single segment in an apocalyptic fireworks chain
      snake.forEach((seg, idx) => {
        deathTimers.push(setTimeout(() => {
          const sx = seg.x * GRID_SIZE + GRID_SIZE / 2;
          const sy = seg.y * GRID_SIZE + GRID_SIZE / 2;
          if (!lowGraphics) {
            spawnHyperExplosion(sx, sy, 40, ['#ff0033', '#ffee00', '#ff00ff', '#fff', '#ff5500'], 1.6);
            addShockwave(sx, sy, '#ff0033', 150);
            triggerLightning(sx, sy, Math.random() * canvas.width, Math.random() * canvas.height, '#ff0033');
            screenShake = Math.max(screenShake, 20);
          }
        }, idx * 25));
      });
    }

    /* =========================================================================
       6. 60FPS MASTER RENDER ENGINE (Post-Processing, CRT, Blooms, Shaders)
       ========================================================================= */
    function renderLoop(timestamp) {
      requestAnimationFrame(renderLoop);

      pollGamepads();

      // Everything below used to advance by a fixed amount per frame, which tied
      // fever duration and every FX decay to the display's refresh rate (fever ran
      // 3.3s instead of 8s at 144Hz). `step` is elapsed time in 60fps frames, so
      // the original constants still read the way they were tuned.
      if (!lastFrame) lastFrame = timestamp - FRAME_MS;
      const dt = Math.min(timestamp - lastFrame, MAX_FRAME_MS);
      lastFrame = timestamp;
      const step = dt / FRAME_MS;
      // Exponential decays need per-second-correct falloff, not rate * step.
      const decay = (perFrame) => Math.pow(perFrame, step);

      rainbowHue = (rainbowHue + 3 * step) % 360;

      // Render Ambient Background Galaxy Particles
      if (!lowGraphics) {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        bgCtx.save();
        bgCtx.globalCompositeOperation = 'lighter';
        bgParticles.forEach(bp => {
          bp.x += bp.vx * (feverActive ? 4 : 1) * step;
          bp.y += bp.vy * (feverActive ? 4 : 1) * step;
          if (bp.x < 0) bp.x = bgCanvas.width;
          if (bp.x > bgCanvas.width) bp.x = 0;
          if (bp.y < 0) bp.y = bgCanvas.height;
          if (bp.y > bgCanvas.height) bp.y = 0;

          const r = bp.size * 3;
          bgCtx.drawImage(getGlowSprite(`hsl(${bp.hue}, 100%, 65%)`), bp.x - r, bp.y - r, r * 2, r * 2);
        });
        bgCtx.restore();
      }

      // Calculate Speed Curve
      const speedScale = Math.min(MAX_SPEED_SCALE,
        1 + score * SPEED_PER_SCORE + combo * SPEED_PER_COMBO + (feverActive ? SPEED_FEVER_BONUS : 0));
      const currentTickRate = Math.max(MIN_TICK_MS, BASE_SPEED / speedScale);
      writeText(speedEl, 'speed', Math.round(speedScale * 100) + '%');
      if (speedScale >= 2.0) unlockAchievement('speed_demon');
      if (speedScale >= MAX_SPEED_SCALE) unlockAchievement('terminal_velocity');
      if (gameStarted && !gameOver && performance.now() - run.startedAt >= 120000) {
        unlockAchievement('long_haul');
      }

      // Update Game Logic Step
      if (timestamp - lastTick >= currentTickRate) {
        updateLogic();
        lastTick = timestamp;
      }

      // Combo Decay
      if (combo > 0) {
        const elapsed = performance.now() - lastEatTimestamp;
        if (elapsed > COMBO_WINDOW) {
          combo = 0;
          comboEl.textContent = '1.0x';
          comboCell.classList.remove('danger-glow');
        }
      }

      // FEVER GAUGE DYNAMICS
      if (feverActive) {
        feverTimeLeft -= dt;
        const progress = Math.max(0, feverTimeLeft / feverDuration);
        writeStyle(feverFill, 'width', 'feverW', (progress * 100) + '%');
        writeText(feverTxt, 'feverTxt', `⚡ FEVER ACTIVE: ${(Math.max(0, feverTimeLeft)/1000).toFixed(1)}s (GODMODE) ⚡`);
        if (feverTimeLeft <= 0) {
          feverActive = false;
          feverEnergy = 0;
          // Riding a full fever cycle out is the achievement. Checking it here
          // rather than on a wall-clock timer keeps it honest at any refresh rate.
          if (gameStarted && !gameOver) unlockAchievement('ghost_slayer');
        }
      } else {
        writeStyle(feverFill, 'width', 'feverW', feverEnergy + '%');
        writeText(feverTxt, 'feverTxt', feverEnergy > 0 ? `ENERGY: ${Math.round(feverEnergy)}%` : `⚡ HYPER-DRIVE IDLE ⚡`);
      }

      // Smooth Camera Decay
      const cameraPull = 1 - decay(0.92);
      cameraZoom += (1 - cameraZoom) * cameraPull;
      cameraRotate += (0 - cameraRotate) * cameraPull;

      let shakeX = 0, shakeY = 0;
      if (!lowGraphics && screenShake > 0) {
        shakeX = (Math.random() - 0.5) * screenShake * 2.5;
        shakeY = (Math.random() - 0.5) * screenShake * 2.5;
      }
      if (screenShake > 0) {
        screenShake *= decay(0.88);
        if (screenShake < 0.2) screenShake = 0;
      }

      if (!lowGraphics) {
        writeStyle(rig, 'transform', 'rig',
          `translate(${shakeX}px, ${shakeY}px) scale(${cameraZoom}) rotate(${cameraRotate}rad)`);
      } else {
        writeStyle(rig, 'transform', 'rig', 'none');
      }

      // Flashes & strobe overlays
      if (!lowGraphics && flashIntensity > 0) {
        writeStyle(superFlash, 'opacity', 'flash', flashIntensity);
      } else {
        writeStyle(superFlash, 'opacity', 'flash', 0);
      }
      if (flashIntensity > 0) {
        flashIntensity *= decay(0.82);
      }

      if (!lowGraphics) {
        writeStyle(apocOverlay, 'opacity', 'apoc',
          feverActive ? (Math.sin(timestamp * 0.02) * 0.25 + 0.35) : (combo > 5 ? 0.2 : 0));
      } else {
        writeStyle(apocOverlay, 'opacity', 'apoc', 0);
      }

      // MAIN CANVAS DRAWING
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = feverActive ? '#050010' : '#010006';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid Lines
      if (!lowGraphics) {
        ctx.lineWidth = 1;
        for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
          const p = Math.sin((timestamp * 0.004) + (x * 0.03)) * 0.12 + 0.12;
          ctx.strokeStyle = feverActive ? `hsla(${(rainbowHue + x) % 360}, 100%, 60%, ${p * 2})` : `rgba(0, 255, 255, ${p})`;
          ctx.beginPath();
          ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
          const p = Math.cos((timestamp * 0.004) + (y * 0.03)) * 0.12 + 0.12;
          ctx.strokeStyle = feverActive ? `hsla(${(rainbowHue + y) % 360}, 100%, 60%, ${p * 2})` : `rgba(255, 0, 128, ${p})`;
          ctx.beginPath();
          ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      } else {
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
        ctx.beginPath();
        for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
          ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        }
        for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
          ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        }
        ctx.stroke();
      }

      // Draw Laser Beams across whole canvas
      for (let i = cosmicLasers.length - 1; i >= 0; i--) {
        const beam = cosmicLasers[i];
        ctx.save();
        ctx.strokeStyle = beam.color;
        ctx.lineWidth = 14 * beam.life;
        ctx.shadowBlur = 35;
        ctx.shadowColor = beam.color;
        ctx.globalAlpha = beam.life;
        // Horizontal & Vertical cross beam
        ctx.beginPath();
        ctx.moveTo(0, beam.y); ctx.lineTo(canvas.width, beam.y);
        ctx.moveTo(beam.x, 0); ctx.lineTo(beam.x, canvas.height);
        ctx.stroke();
        ctx.restore();

        beam.life -= 0.05 * step;
        if (beam.life <= 0) cosmicLasers.splice(i, 1);
      }

      // Snake Body Trail Sparkles
      if (!lowGraphics && gameStarted && !gameOver) {
        const sparkleChance = 0.4 * step;
        snake.forEach((seg, idx) => {
          if (Math.random() < sparkleChance) {
            particles.push({
              x: seg.x * GRID_SIZE + Math.random() * GRID_SIZE,
              y: seg.y * GRID_SIZE + Math.random() * GRID_SIZE,
              vx: (Math.random() - 0.5) * 2,
              vy: (Math.random() - 0.5) * 2,
              life: 0.7,
              decay: 0.04,
              // Quantised to 10deg so the glow sprite cache tops out at 37 entries.
            color: `hsl(${Math.round(((rainbowHue + idx * 18) % 360) / 10) * 10}, 100%, 70%)`,
              size: Math.random() * 4 + 2
            });
          }
        });
      }

      // Draw All Food Arsenals
      ctx.save();

      // Halo pass first, additively, so the cores below stay crisp.
      if (!lowGraphics) {
        ctx.globalCompositeOperation = 'lighter';
        foods.forEach(f => {
          const pulse = Math.sin((timestamp * 0.012) + f.phase) * 5;
          const r = Math.max(4, GRID_SIZE / 2 - 2 + pulse) * 2.3;
          ctx.drawImage(getGlowSprite(getFoodColor(f.type)),
            f.x * GRID_SIZE + GRID_SIZE / 2 - r, f.y * GRID_SIZE + GRID_SIZE / 2 - r, r * 2, r * 2);
        });
        ctx.globalCompositeOperation = 'source-over';
      }

      // Text state is identical for every food, so it's set once, not per item.
      ctx.font = '12px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;

      foods.forEach(f => {
        const fx = f.x * GRID_SIZE + GRID_SIZE / 2;
        const fy = f.y * GRID_SIZE + GRID_SIZE / 2;
        const pulse = lowGraphics ? 0 : Math.sin((timestamp * 0.012) + f.phase) * 5;
        const r = Math.max(4, GRID_SIZE / 2 - 2 + pulse);
        const col = getFoodColor(f.type);

        // Rotating Energy Ring
        if (!lowGraphics) {
          ctx.strokeStyle = col;
          ctx.beginPath();
          ctx.arc(fx, fy, r + 6 + pulse, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Pulsing Core
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(fx, fy, r, 0, Math.PI * 2);
        ctx.fill();

        // Blazing White Sun Core
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(fx - r * 0.25, fy - r * 0.25, r * 0.4, 0, Math.PI * 2);
        ctx.fill();

        // Extra icon on top of food
        ctx.fillStyle = '#000';
        ctx.fillText(FOOD_SYMBOLS[f.type] || '★', fx, fy + 1);
      });
      ctx.restore();

      // Draw Snake (Glowing Dragon with Laser Eyes). The halo used to be a
      // ctx.shadowBlur on every segment, which is one full filter pass each: a
      // 40-long snake cost 40 of them per frame, and it only gets worse as you
      // grow. It's now a single additive sprite pass over the same segments.
      ctx.save();
      if (!lowGraphics) {
        ctx.globalCompositeOperation = 'lighter';
        snake.forEach((seg, i) => {
          const r = GRID_SIZE * (i === 0 ? 1.5 : 1.1);
          ctx.globalAlpha = i === 0 ? 0.9 : 0.55;
          ctx.drawImage(getGlowSprite(segmentGlowColor(i)),
            seg.x * GRID_SIZE + GRID_SIZE / 2 - r, seg.y * GRID_SIZE + GRID_SIZE / 2 - r, r * 2, r * 2);
        });
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }

      snake.forEach((seg, i) => {
        const px = seg.x * GRID_SIZE;
        const py = seg.y * GRID_SIZE;
        const segColor = segmentColor(i);

        ctx.fillStyle = i === 0 ? '#ffffff' : segColor;
        ctx.beginPath();
        ctx.roundRect(px + 2, py + 2, GRID_SIZE - 4, GRID_SIZE - 4, 9);
        ctx.fill();

        // Inner core
        ctx.fillStyle = i === 0 ? segColor : '#ffffff';
        ctx.beginPath();
        ctx.arc(px + GRID_SIZE / 2, py + GRID_SIZE / 2, i === 0 ? 5 : 3, 0, Math.PI * 2);
        ctx.fill();

        // Head Eyes
        if (i === 0) {
          ctx.fillStyle = '#ff0033';
          let e1 = { x: px + 8, y: py + 8 };
          let e2 = { x: px + GRID_SIZE - 8, y: py + 8 };
          if (direction.x === 1) {
            e1 = { x: px + GRID_SIZE - 8, y: py + 8 };
            e2 = { x: px + GRID_SIZE - 8, y: py + GRID_SIZE - 8 };
          } else if (direction.x === -1) {
            e1 = { x: px + 8, y: py + 8 };
            e2 = { x: px + 8, y: py + GRID_SIZE - 8 };
          } else if (direction.y === 1) {
            e1 = { x: px + 8, y: py + GRID_SIZE - 8 };
            e2 = { x: px + GRID_SIZE - 8, y: py + GRID_SIZE - 8 };
          }
          ctx.beginPath();
          ctx.arc(e1.x, e1.y, 4, 0, Math.PI * 2);
          ctx.arc(e2.x, e2.y, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.restore();

      // Draw Lightning Bolts
      for (let i = lightningBolts.length - 1; i >= 0; i--) {
        const bolt = lightningBolts[i];
        ctx.save();
        ctx.strokeStyle = bolt.color;
        ctx.lineWidth = 4 * bolt.life;
        ctx.shadowBlur = 30;
        ctx.shadowColor = bolt.color;
        ctx.globalAlpha = bolt.life;
        ctx.beginPath();
        bolt.segments.forEach(seg => {
          ctx.moveTo(seg.x1, seg.y1);
          ctx.lineTo(seg.x2, seg.y2);
        });
        ctx.stroke();
        ctx.restore();

        bolt.life -= 0.07 * step;
        if (bolt.life <= 0) lightningBolts.splice(i, 1);
      }

      // Draw Shockwaves
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        ctx.save();
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = 6 * sw.opacity;
        ctx.globalAlpha = sw.opacity;
        ctx.shadowBlur = 35;
        ctx.shadowColor = sw.color;
        ctx.stroke();
        ctx.restore();

        sw.radius += 10 * step;
        sw.opacity -= 0.035 * step;
        if (sw.opacity <= 0 || sw.radius >= sw.maxRadius) shockwaves.splice(i, 1);
      }

      // Draw Particles. One save/restore for the whole pass, additive blending,
      // no per-particle shadow blur.
      const drag = decay(0.94);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * step;
        p.y += p.vy * step;
        p.vx *= drag;
        p.vy *= drag;
        p.life -= p.decay * step;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        // 2.6x the old core radius: the sprite's outer falloff stands in for the
        // 18px shadow blur that used to surround it.
        const r = Math.max(1, p.size * p.life) * 2.6;
        ctx.globalAlpha = Math.min(1, p.life);
        ctx.drawImage(getGlowSprite(p.color), p.x - r, p.y - r, r * 2, r * 2);
      }
      ctx.restore();

      // Draw Floating Points & Announcements
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy * step;
        ft.life -= ft.decay * step;

        if (ft.life <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = ft.life;
        ctx.font = `900 ${Math.round(24 * ft.scale)}px 'Black Ops One', sans-serif`;
        ctx.fillStyle = ft.color;
        if (!lowGraphics) {
          ctx.shadowBlur = 25;
          ctx.shadowColor = ft.color;
        }
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      // OVERLAY MENUS
      if (!gameStarted && !gameOver) {
        ctx.save();
        ctx.fillStyle = 'rgba(2, 0, 10, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = '900 36px "Black Ops One", sans-serif';
        ctx.fillStyle = '#00ffff';
        if (!lowGraphics) {
          ctx.shadowBlur = 40;
          ctx.shadowColor = '#00ffff';
        }
        ctx.textAlign = 'center';
        ctx.fillText('⚡ ENGAGE APOCALYPSE ⚡', canvas.width / 2, canvas.height / 2 - 25);

        ctx.font = '700 16px "Orbitron", sans-serif';
        ctx.fillStyle = '#ff0055';
        if (!lowGraphics) {
          ctx.shadowColor = '#ff0055';
        }
        ctx.fillText('PRESS ARROW / WASD / [A] BUTTON TO IGNITE', canvas.width / 2, canvas.height / 2 + 25);
        ctx.restore();
      } else if (gameOver) {
        ctx.save();
        ctx.fillStyle = 'rgba(10, 0, 5, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = '900 48px "Black Ops One", sans-serif';
        ctx.fillStyle = '#ff0033';
        if (!lowGraphics) {
          ctx.shadowBlur = 50;
          ctx.shadowColor = '#ff0033';
        }
        ctx.textAlign = 'center';
        ctx.fillText('TOTAL EXTINCTION', canvas.width / 2, canvas.height / 2 - 40);

        ctx.font = '900 26px "Orbitron", sans-serif';
        ctx.fillStyle = '#ffee00';
        if (!lowGraphics) {
          ctx.shadowBlur = 20;
          ctx.shadowColor = '#ffee00';
        }
        ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 10);

        ctx.font = '700 15px "Orbitron", sans-serif';
        ctx.fillStyle = '#00ffff';
        if (!lowGraphics) {
          ctx.shadowColor = '#00ffff';
        }
        ctx.fillText('PRESS SPACE / ENTER / [A] TO RESPAWN', canvas.width / 2, canvas.height / 2 + 55);
        ctx.restore();
      }

      ctx.restore();
    }

    /* =========================================================================
       7. INPUT HANDLING
       ========================================================================= */
    // The run clock starts here rather than at resetGame, so sitting on the title
    // screen doesn't count towards LONG HAUL.
    function startGame() {
      gameStarted = true;
      run.startedAt = performance.now();
      triggerScreamer('⚡ OVERDRIVE ENGAGED ⚡', '#00ffff');
    }

    function handleAction(key) {
      initAudio();

      if (gameOver && (key === ' ' || key === 'Enter')) {
        resetGame();
        return;
      }

      if (!gameStarted && !gameOver && (key === ' ' || key === 'Enter')) {
        startGame();
        return;
      }

      let newDir = null;
      if (key === 'ArrowUp' || key === 'w' || key === 'W') newDir = { x: 0, y: -1 };
      else if (key === 'ArrowDown' || key === 's' || key === 'S') newDir = { x: 0, y: 1 };
      else if (key === 'ArrowLeft' || key === 'a' || key === 'A') newDir = { x: -1, y: 0 };
      else if (key === 'ArrowRight' || key === 'd' || key === 'D') newDir = { x: 1, y: 0 };

      if (newDir) {
        if (!gameStarted && !gameOver) startGame();
        if (newDir.x !== -direction.x || newDir.y !== -direction.y) {
          if (newDir.x !== direction.x || newDir.y !== direction.y) {
            playExtremeSound('turn');
          }
          nextDirection = newDir;
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      const allowed = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'w', 'a', 's', 'd', 'W', 'A', 'S', 'D', 'Enter'];
      if (allowed.includes(e.key)) {
        e.preventDefault();
        handleAction(e.key);
      }
    });

    document.querySelectorAll('.touch-btn').forEach((btn) => {
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleAction(btn.getAttribute('data-key'));
      });
    });

    resetGame();
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
