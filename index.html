<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🔥💥 HYPER SNAKE // APOCALYPSE SINGULARITY: MAXIMUM UNCHAINED OVERKILL 💥🔥</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Creepster&family=Press+Start+2P&family=Rubik+Glitch&family=Orbitron:wght@400;700;900&display=swap');

    :root {
      --neon-pink: #ff0055;
      --neon-cyan: #00ffff;
      --neon-lime: #00ff66;
      --neon-yellow: #ffee00;
      --neon-purple: #bd00ff;
      --neon-orange: #ff5500;
      --blood-red: #ff0033;
      --plasma-blue: #0088ff;
      --void-black: #000003;

      /* The canvas keeps its 540x540 backing store and CSS stretches it, so these
         decide how big the game looks. The board takes whatever vertical space is
         left after the chrome rather than subtracting a guessed reserve: the title
         and HUD change height as they reflow, so any fixed number is wrong at some
         width. --board-reserve-x only bounds it horizontally, where the sidebar
         sits. */
      --board-reserve-x: 300px;
      --board-max: 1100px;

      /* Measured board edge and its ratio to the 540px draw space, both written by
         refreshViewScale() once layout has settled. Used for the chrome that has to
         track the board, and for the few things sized in screen pixels rather than
         draw-space pixels. */
      --board: 540px;
      --board-scale: 1;
      --rig-pad: calc(8px * var(--board-scale));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--void-black);
      color: #fff;
      font-family: 'Orbitron', monospace, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1400px;
    }

    /* Strobes, hyper-flashes, screen tint overlay */
    #apocalypse-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: screen;
      opacity: 0;
      background: radial-gradient(circle, #fff 0%, #ff0055 40%, transparent 80%);
    }

    #super-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
      background: #fff;
      opacity: 0;
    }

    /* 3D Infinity Hyperspace Wormhole Grid */
    .space-warp-grid {
      position: fixed;
      inset: -100%;
      width: 300%;
      height: 300%;
      background-image: 
        radial-gradient(circle at center, transparent 0%, rgba(2,0,10,0.8) 70%),
        linear-gradient(rgba(0, 255, 255, 0.2) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255, 0, 128, 0.2) 2px, transparent 2px);
      background-size: 100% 100%, 60px 60px, 60px 60px;
      transform: perspective(400px) rotateX(75deg) translateY(-300px);
      animation: warpHyper 1.8s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes warpHyper {
      0% {
        background-position: 0 0, 0 0, 0 0;
      }
      100% {
        background-position: 0 0, 0 60px, 0 60px;
      }
    }

    /* Floating Hyper Neon Particle Canvas in body background */
    #bg-fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Extreme layout container */
    .master-wrapper {
      position: relative;
      z-index: 10;
      /* Definite height, so .center-col can hand the rig a real box to grow into.
         Without it the flex chain is indefinite and the canvas falls back to its
         540px attribute size. */
      height: 100vh;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      max-width: 100vw;
      padding: 0.5rem;
      transform-style: preserve-3d;
    }

    /* Left Sidebar: Unlocked Achievements Tracker */
    .sidebar {
      width: 220px;
      height: min(var(--board), calc(100vh - 2rem));
      min-height: 320px;
      background: rgba(10, 0, 25, 0.85);
      border: 2px solid var(--neon-cyan);
      border-radius: 14px;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(255, 0, 85, 0.2);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .sidebar-title {
      font-family: 'Black Ops One', cursive;
      font-size: 0.95rem;
      color: var(--neon-yellow);
      text-align: center;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--neon-yellow);
      border-bottom: 2px dashed rgba(255, 238, 0, 0.4);
      padding-bottom: 0.4rem;
    }

    .achievements-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .achievements-list::-webkit-scrollbar { display: none; }

    .achieve-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      font-size: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0.35;
      filter: grayscale(1);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .achieve-card.unlocked {
      opacity: 1;
      filter: grayscale(0);
      border-color: var(--neon-lime);
      background: rgba(0, 255, 102, 0.12);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
      animation: badgePop 0.4s ease;
    }

    @keyframes badgePop {
      0% { transform: scale(0.7); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .achieve-name {
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .achieve-card.unlocked .achieve-name { color: var(--neon-lime); }
    .achieve-desc { font-size: 0.55rem; color: #aaa; }

    /* Center game column */
    .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      height: 100%;
      min-height: 0;
      max-width: 100%;
    }

    /* Psycho header */
    .title-banner {
      font-family: 'Rubik Glitch', 'Black Ops One', cursive;
      font-size: clamp(0.95rem, 3.1vw, 3.2rem);
      letter-spacing: 0.4rem;
      white-space: nowrap;
      text-transform: uppercase;
      text-align: center;
      background: linear-gradient(180deg, #fff 0%, var(--neon-yellow) 25%, var(--neon-pink) 60%, var(--neon-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px #ff0055) drop-shadow(0 0 60px #00ffff);
      animation: hyperFlicker 0.25s infinite alternate;
      /* The display face overshoots its em box, and the flicker keyframes scale it
         to 1.04. At line-height 1 that clipped against the top of the viewport once
         the layout became height-bound. */
      line-height: 1.2;
      padding: 0.06em 0;
    }

    @keyframes hyperFlicker {
      0% { transform: skewX(-3deg) scale(1.02); filter: drop-shadow(0 0 35px #ff0055) hue-rotate(0deg); }
      50% { transform: skewX(3deg) scale(0.98); }
      100% { transform: skewX(0deg) scale(1.04); filter: drop-shadow(0 0 55px #00ffff) hue-rotate(90deg); }
    }

    /* Top HUD Row */
    .hud-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0.5rem;
      width: calc(var(--board) + var(--rig-pad) * 2);
      max-width: 100%;
    }

    .hud-cell {
      background: rgba(12, 0, 30, 0.85);
      border: 2px solid rgba(0, 255, 255, 0.4);
      border-radius: 10px;
      padding: 0.35rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.25);
      backdrop-filter: blur(8px);
    }

    .hud-cell.danger-glow {
      border-color: var(--blood-red) !important;
      box-shadow: 0 0 25px var(--blood-red), inset 0 0 15px var(--blood-red) !important;
      animation: redAlert 0.2s infinite alternate;
    }

    @keyframes redAlert {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.7); }
    }

    .hud-lbl {
      font-size: 0.55rem;
      letter-spacing: 1px;
      white-space: nowrap;
      color: #00ffff;
      font-weight: 900;
      text-transform: uppercase;
    }

    .hud-val {
      font-family: 'Black Ops One', monospace;
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 12px #00ffff;
    }

    .gamepad-tag {
      font-size: 0.85rem;
      font-weight: 900;
      color: #666;
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }

    .gfx-btn {
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.5);
      color: var(--neon-cyan);
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      font-weight: 900;
      border-radius: 6px;
      padding: 0.25rem 0.4rem;
      margin-top: 0.2rem;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }
    .gfx-btn:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 10px var(--neon-cyan);
    }
    .gfx-btn.low {
      border-color: var(--neon-lime);
      color: var(--neon-lime);
    }
    .gfx-btn.low:hover {
      background: var(--neon-lime);
      color: #000;
      box-shadow: 0 0 10px var(--neon-lime);
    }

    /* Low graphics overrides for CSS animations / heavy elements */
    body.low-gfx .space-warp-grid {
      display: none !important;
    }
    body.low-gfx #bg-fx-canvas {
      display: none !important;
    }
    body.low-gfx .title-banner {
      animation: none !important;
      filter: none !important;
    }
    body.low-gfx #rig-container {
      animation: none !important;
      background: #1a0033 !important;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3) !important;
    }
    body.low-gfx .vignette-crt {
      display: none !important;
    }
    body.low-gfx .sidebar {
      backdrop-filter: none !important;
      box-shadow: none !important;
    }
    body.low-gfx .hud-cell {
      backdrop-filter: none !important;
      box-shadow: none !important;
    }
    body.low-gfx .hud-cell.danger-glow,
    body.low-gfx .achieve-card.unlocked,
    body.low-gfx .gamepad-tag.connected {
      animation: none !important;
    }

    /* Photosensitivity guard. The title flicker (4Hz), combo alert (5Hz) and the
       full-screen white flash all sit above the 3Hz seizure threshold, so they
       come off entirely when the OS asks for reduced motion. This is independent
       of the GFX toggle: it holds even if the player switches back to ULTRA. */
    @media (prefers-reduced-motion: reduce) {
      .space-warp-grid,
      #bg-fx-canvas,
      .vignette-crt,
      #super-flash,
      #apocalypse-overlay {
        display: none !important;
      }
      .title-banner,
      #rig-container,
      .hud-cell.danger-glow,
      .achieve-card.unlocked,
      .gamepad-tag.connected {
        animation: none !important;
      }
      .title-banner {
        filter: none !important;
      }
      #rig-container {
        background: #1a0033 !important;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.3) !important;
      }
      #screamer-text,
      #achievement-popup,
      .achieve-card {
        transition: none !important;
      }
    }

    .gamepad-tag.connected {
      color: var(--neon-lime);
      text-shadow: 0 0 10px var(--neon-lime);
      animation: padPulse 1s infinite alternate;
    }

    @keyframes padPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* Multi-tier Fever Mode Energy Bar */
    .fever-bar-wrap {
      width: calc(var(--board) + var(--rig-pad) * 2);
      max-width: 100%;
      height: 14px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid var(--neon-yellow);
      border-radius: 7px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 238, 0, 0.4);
    }

    .fever-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-lime), var(--neon-yellow), var(--neon-pink), #fff);
      background-size: 300% 100%;
      animation: rainbowLaser 0.5s linear infinite;
      box-shadow: 0 0 25px #ff0055;
    }

    @keyframes rainbowLaser {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .fever-text-indicator {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 4px #000, 0 0 10px #ff0055;
    }

    /* Viewport Frame with Insane Shaders & Borders */
    #rig-container {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--rig-pad);
      border-radius: 18px;
      background: linear-gradient(45deg, #ff0055, #bd00ff, #00ffff, #ffee00, #00ff66, #ff0055);
      background-size: 600% 600%;
      animation: borderSupernova 1.5s ease infinite;
      box-shadow: 
        0 0 60px rgba(255, 0, 85, 0.7),
        0 0 120px rgba(0, 255, 255, 0.4),
        inset 0 0 40px rgba(255, 255, 255, 0.7);
      transform-origin: center center;
    }

    @keyframes borderSupernova {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    canvas#game {
      display: block;
      /* Square, as tall as the rig lets it be, and never wider than the space
         left beside the sidebar. */
      height: 100%;
      width: auto;
      aspect-ratio: 1 / 1;
      /* Both axes take the same ceiling. Capping only max-width would leave the
         definite height untouched and the board would stop being square on a
         narrow viewport; aspect-ratio only derives the axis that is auto. */
      max-height: min(var(--board-max), calc(100vw - var(--board-reserve-x)));
      max-width: min(var(--board-max), calc(100vw - var(--board-reserve-x)));
      background: #000;
      border-radius: 12px;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
    }

    /* Screen overlays */
    .vignette-crt {
      position: absolute;
      inset: var(--rig-pad);
      border-radius: 12px;
      background: 
        radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 100%),
        linear-gradient(rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.5) 50%);
      background-size: 100% 100%, 100% calc(4px * var(--board-scale));
      pointer-events: none;
      z-index: 8;
    }

    /* Giant Voice/Announcer Overdrive Banner */
    #screamer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0) rotate(-15deg);
      font-family: 'Black Ops One', 'Creepster', cursive;
      font-size: 4rem;
      font-weight: 900;
      color: #fff;
      text-align: center;
      white-space: nowrap;
      text-shadow: 
        0 0 25px var(--neon-yellow),
        0 0 60px var(--neon-pink),
        0 0 100px var(--neon-cyan);
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.6), opacity 0.25s ease;
    }

    .screamer-active {
      transform: translate(-50%, -50%) scale(1.2) rotate(3deg) !important;
      opacity: 1 !important;
    }

    /* Achievement Pop-up Banner on the top-right */
    #achievement-popup {
      position: fixed;
      top: 25px;
      right: -400px;
      background: linear-gradient(90deg, #10002b, #240046);
      border: 2px solid var(--neon-yellow);
      border-radius: 12px;
      padding: 0.8rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 0 35px var(--neon-yellow), inset 0 0 15px rgba(255, 238, 0, 0.4);
      z-index: 100;
      transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #achievement-popup.show {
      right: 25px;
    }
    .pop-icon { font-size: 2.2rem; }
    .pop-info { display: flex; flex-direction: column; }
    .pop-tag { font-size: 0.65rem; color: var(--neon-yellow); font-weight: 900; letter-spacing: 2px; }
    .pop-title { font-size: 1.1rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px #fff; }

    /* Touch inputs */
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      width: 260px;
      margin-top: 0.4rem;
    }

    .touch-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid var(--neon-cyan);
      color: #fff;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1.6rem;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
      touch-action: manipulation;
    }
    .touch-btn:active {
      background: var(--neon-yellow);
      color: #000;
      box-shadow: 0 0 40px var(--neon-yellow);
    }
    .up { grid-column: 2; }
    .left { grid-column: 1; grid-row: 2; }
    .down { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }

    @media (max-width: 950px) {
      /* No sidebar, so the board gets the full width. */
      :root { --board-reserve-x: 24px; }
      .sidebar { display: none; }
    }

    /* Fullscreen hands back the vertical space the browser chrome was using, which
       the flex layout picks up on its own. All that's needed here is permission to
       go past the windowed ceiling. */
    :root:fullscreen {
      --board-max: 1500px;
    }

    @media (hover: none) and (pointer: coarse) {
      .touch-controls { display: grid; }
    }
  </style>
</head>
<body>
  <div class="space-warp-grid"></div>
  <canvas id="bg-fx-canvas"></canvas>
  <div id="apocalypse-overlay"></div>
  <div id="super-flash"></div>

  <!-- Achievement Notification popup -->
  <div id="achievement-popup">
    <div class="pop-icon" id="pop-icon">🏆</div>
    <div class="pop-info">
      <span class="pop-tag">⚡ TROPHY UNLOCKED ⚡</span>
      <span class="pop-title" id="pop-name">FIRST BLOOD</span>
    </div>
  </div>

  <div class="master-wrapper">
    <!-- Sidebar: Trophy Gallery -->
    <div class="sidebar">
      <div class="sidebar-title">🔥 ACHIEVEMENTS (<span id="achieve-count">0/43</span>)</div>
      <div class="achievements-list" id="achieve-list"></div>
    </div>

    <!-- Center Stage -->
    <div class="center-col">
      <div class="title-banner">HYPER SNAKE 🔥 SINGULARITY</div>

      <!-- Super HUD -->
      <div class="hud-grid">
        <div class="hud-cell">
          <span class="hud-lbl">SCORE</span>
          <span id="score" class="hud-val">0</span>
        </div>
        <div class="hud-cell" id="combo-cell">
          <span class="hud-lbl">COMBO</span>
          <span id="combo-val" class="hud-val" style="color: var(--neon-yellow);">1.0x</span>
        </div>
        <div class="hud-cell">
          <span class="hud-lbl">LENGTH</span>
          <span id="len-val" class="hud-val" style="color: var(--neon-lime);">5</span>
        </div>
        <div class="hud-cell">
          <span class="hud-lbl">HYPER SPEED</span>
          <span id="speed-val" class="hud-val" style="color: var(--neon-pink);">100%</span>
        </div>
        <div class="hud-cell">
          <span class="hud-lbl">BEST</span>
          <span id="best-val" class="hud-val" style="color: var(--neon-cyan);">0</span>
        </div>
        <div class="hud-cell">
          <span class="hud-lbl">PAD</span>
          <span id="pad-val" class="hud-val gamepad-tag">OFF</span>
        </div>
        <div class="hud-cell">
          <span class="hud-lbl">GFX</span>
          <button id="gfx-toggle" class="gfx-btn" title="Toggle Graphics Quality (High / Low)">ULTRA</button>
        </div>
        <div class="hud-cell">
          <span class="hud-lbl">SCREEN</span>
          <button id="fs-toggle" class="gfx-btn" title="Toggle Fullscreen (F)">FULL</button>
        </div>
      </div>

      <!-- FEVER / OVERDRIVE CHARGE BAR -->
      <div class="fever-bar-wrap">
        <div class="fever-fill" id="fever-fill"></div>
        <div class="fever-text-indicator" id="fever-txt">⚡ HYPER-DRIVE IDLE ⚡</div>
      </div>

      <!-- Game Canvas Rig -->
      <div id="rig-container">
        <div class="vignette-crt"></div>
        <div id="screamer-text">SINGULARITY!!</div>
        <canvas id="game" width="540" height="540"></canvas>
      </div>

      <!-- Touch Controls -->
      <div class="touch-controls">
        <button class="touch-btn up" data-key="ArrowUp">▲</button>
        <button class="touch-btn left" data-key="ArrowLeft">◀</button>
        <button class="touch-btn down" data-key="ArrowDown">▼</button>
        <button class="touch-btn right" data-key="ArrowRight">▶</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       0. PERSISTENCE HELPERS
       ========================================================================= */
    // localStorage throws in private mode / with cookies disabled, and can hold
    // garbage written by an older build. Neither should take the whole game down
    // before the canvas ever draws.
    function storageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }

    function storageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        /* not persistable in this context; the session still plays fine */
      }
    }

    // Assigning an unchanged textContent or style value still costs a style
    // invalidation. The HUD, the fever bar and the camera transform are all
    // written on every single frame and mostly don't change between them.
    const lastWrite = {};

    function writeText(el, key, value) {
      if (lastWrite[key] === value) return;
      lastWrite[key] = value;
      el.textContent = value;
    }

    function writeStyle(el, prop, key, value) {
      if (lastWrite[key] === value) return;
      lastWrite[key] = value;
      el.style[prop] = value;
    }

    function storageGetJSON(key, fallback) {
      const raw = storageGet(key);
      if (raw === null) return fallback;
      try {
        const parsed = JSON.parse(raw);
        return (parsed && typeof parsed === 'object') ? parsed : fallback;
      } catch (e) {
        return fallback;
      }
    }

    /* =========================================================================
       1. 150BPM PROCEDURAL DRUM & SYNTHWAVE / DUBSTEP AUDIO ENGINE (Web Audio)
       ========================================================================= */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    // Every voice routes through this rather than straight out, so stacked sounds
    // (nuke noise + sub + drums + bass) get limited instead of clipping.
    let masterBus = null;
    // One shared noise buffer for the snare and the nuke blast. Regenerating it
    // per hit churned ~6600 floats every 800ms for the life of the page.
    let noiseBuffer = null;

    function getNoiseBuffer() {
      if (!noiseBuffer) {
        const len = Math.floor(actx.sampleRate * 1.2);
        noiseBuffer = actx.createBuffer(1, len, actx.sampleRate);
        const d = noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      return noiseBuffer;
    }

    function initAudio() {
      if (!actx) {
        actx = new AudioContext();
        masterBus = actx.createGain();
        masterBus.gain.value = 0.8;
        const limiter = actx.createDynamicsCompressor();
        limiter.threshold.value = -6;
        limiter.knee.value = 6;
        limiter.ratio.value = 12;
        limiter.attack.value = 0.003;
        limiter.release.value = 0.15;
        masterBus.connect(limiter);
        limiter.connect(actx.destination);
        startSynthSoundtrack();
      }
      if (actx.state === 'suspended') actx.resume();
    }

    let musicTimer = null;
    let musicBeat = 0;
    // Hardstyle / Darksynth Bassline progression
    // F1, F1, G#1, A#1, F1, C2, D#2, F2
    const synthNotes = [43.65, 43.65, 51.91, 58.27, 43.65, 65.41, 77.78, 87.31];

    function startSynthSoundtrack() {
      if (musicTimer) return;
      const bpm = 150;
      const intervalMs = (60 / bpm / 4) * 1000; // 16th notes

      musicTimer = setInterval(() => {
        if (!actx || !gameStarted || gameOver) return;
        const t = actx.currentTime;

        // Kick on every quarter note (step 0, 4, 8, 12)
        if (musicBeat % 4 === 0) {
          const kickOsc = actx.createOscillator();
          const kickGain = actx.createGain();
          kickOsc.type = 'sine';
          kickOsc.frequency.setValueAtTime(140, t);
          kickOsc.frequency.exponentialRampToValueAtTime(35, t + 0.12);
          kickGain.gain.setValueAtTime(feverActive ? 0.6 : 0.4, t);
          kickGain.gain.linearRampToValueAtTime(0.001, t + 0.14);
          kickOsc.connect(kickGain);
          kickGain.connect(masterBus);
          kickOsc.start(t);
          kickOsc.stop(t + 0.14);
        }

        // Snare / Clap on step 4 & 12
        if (musicBeat % 8 === 4) {
          const noiseSrc = actx.createBufferSource();
          noiseSrc.buffer = getNoiseBuffer();
          const filter = actx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(1000, t);
          const noiseGain = actx.createGain();
          noiseGain.gain.setValueAtTime(0.09, t);
          noiseGain.gain.linearRampToValueAtTime(0.001, t + 0.15);
          noiseSrc.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(masterBus);
          noiseSrc.start(t);
          noiseSrc.stop(t + 0.15);
        }

        // Heavy Rolling Acid Bass
        if (musicBeat % 2 === 0) {
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          const flt = actx.createBiquadFilter();

          osc.type = feverActive ? 'sawtooth' : 'square';
          const rootFreq = synthNotes[(Math.floor(musicBeat / 4)) % synthNotes.length];
          const oct = feverActive ? 2 : 1;
          osc.frequency.setValueAtTime(rootFreq * oct, t);

          flt.type = 'lowpass';
          flt.Q.setValueAtTime(feverActive ? 8 : 4, t);
          flt.frequency.setValueAtTime(feverActive ? 3000 : 800, t);
          flt.frequency.exponentialRampToValueAtTime(100, t + 0.15);

          gain.gain.setValueAtTime(0.2, t);
          gain.gain.linearRampToValueAtTime(0.001, t + 0.15);

          osc.connect(flt);
          flt.connect(gain);
          gain.connect(masterBus);
          osc.start(t);
          osc.stop(t + 0.15);
        }

        musicBeat++;
      }, intervalMs);
    }

    // Dynamic Extreme SFX System
    function playExtremeSound(type) {
      if (!actx) return;
      const t = actx.currentTime;

      if (type === 'eat_normal') {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.exponentialRampToValueAtTime(1200, t + 0.12);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
        osc.connect(gain);
        gain.connect(masterBus);
        osc.start(t);
        osc.stop(t + 0.12);
      } else if (type === 'eat_laser') {
        // Laser Zap
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1800, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.2);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
        osc.connect(gain);
        gain.connect(masterBus);
        osc.start(t);
        osc.stop(t + 0.2);
      } else if (type === 'eat_nuke') {
        // Thermonuclear bomb explosion noise + sub drop
        const noise = actx.createBufferSource();
        noise.buffer = getNoiseBuffer();
        const flt = actx.createBiquadFilter();
        flt.type = 'lowpass';
        flt.frequency.setValueAtTime(1200, t);
        flt.frequency.exponentialRampToValueAtTime(20, t + 1.2);
        const g = actx.createGain();
        g.gain.setValueAtTime(0.8, t);
        g.gain.linearRampToValueAtTime(0.01, t + 1.2);
        noise.connect(flt);
        flt.connect(g);
        g.connect(masterBus);
        noise.start(t);
        noise.stop(t + 1.2);

        // Sub blast
        const sub = actx.createOscillator();
        const subG = actx.createGain();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(90, t);
        sub.frequency.exponentialRampToValueAtTime(20, t + 0.8);
        subG.gain.setValueAtTime(0.7, t);
        subG.gain.linearRampToValueAtTime(0.01, t + 0.8);
        sub.connect(subG);
        subG.connect(masterBus);
        sub.start(t);
        sub.stop(t + 0.8);
      } else if (type === 'eat_blackhole') {
        // Cosmic Singularity Riser
        const osc = actx.createOscillator();
        const g = actx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, t);
        osc.frequency.exponentialRampToValueAtTime(2400, t + 0.5);
        g.gain.setValueAtTime(0.4, t);
        g.gain.linearRampToValueAtTime(0.01, t + 0.5);
        osc.connect(g);
        g.connect(masterBus);
        osc.start(t);
        osc.stop(t + 0.5);
      } else if (type === 'turn') {
        const osc = actx.createOscillator();
        const g = actx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(110, t + 0.04);
        g.gain.setValueAtTime(0.08, t);
        g.gain.linearRampToValueAtTime(0.001, t + 0.04);
        osc.connect(g);
        g.connect(masterBus);
        osc.start(t);
        osc.stop(t + 0.04);
      } else if (type === 'fever_activate') {
        // Victory Fanfare Chord
        [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98].forEach((f, idx) => {
          const o = actx.createOscillator();
          const g = actx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(f, t + idx * 0.03);
          g.gain.setValueAtTime(0.25, t + idx * 0.03);
          g.gain.linearRampToValueAtTime(0.001, t + idx * 0.03 + 0.4);
          o.connect(g);
          g.connect(masterBus);
          o.start(t + idx * 0.03);
          o.stop(t + idx * 0.03 + 0.4);
        });
      } else if (type === 'achieve') {
        [440, 554.37, 659.25, 880].forEach((f, i) => {
          const o = actx.createOscillator();
          const g = actx.createGain();
          o.type = 'square';
          o.frequency.setValueAtTime(f, t + i * 0.07);
          g.gain.setValueAtTime(0.2, t + i * 0.07);
          g.gain.linearRampToValueAtTime(0.001, t + i * 0.07 + 0.15);
          o.connect(g);
          g.connect(masterBus);
          o.start(t + i * 0.07);
          o.stop(t + i * 0.07 + 0.15);
        });
      }
    }

    function cornerOf(x, y) {

    // The canvas keeps its 540x540 backing store and CSS stretches it to whatever
    // --board resolves to, so every draw call still works in the coordinate space
    // it was written for. This is the one number relating screen pixels to
    // draw-space pixels, for the few things measured in the former: the shake
    // amplitude on the rig, and the CRT scanline pitch.
    const VIEW_SIZE = canvas.width;
    let viewScale = 1;

    function refreshViewScale() {
      const shown = canvas.clientWidth;
      if (!shown) return;                      // display:none, nothing to measure
      viewScale = shown / VIEW_SIZE;
      const root = document.documentElement.style;
      root.setProperty('--board', shown + 'px');
      root.setProperty('--board-scale', viewScale.toFixed(4));

      if (!canFullscreen) return;

    function rumbleGamepad(duration = 150, weak = 0.5, strong = 0.5) {
      if (!navigator.getGamepads) return;
      const gamepads = navigator.getGamepads();
      for (let i = 0; i < gamepads.length; i++) {
        const gp = gamepads[i];
        if (gp && gp.vibrationActuator && gp.vibrationActuator.playEffect) {
          gp.vibrationActuator.playEffect('dual-rumble', {
            startDelay: 0,
            duration: duration,
            weakMagnitude: Math.min(1, weak),
            strongMagnitude: Math.min(1, strong)
          }).catch(() => {});
        } else if (gp && gp.hapticActuators && gp.hapticActuators[0] && gp.hapticActuators[0].pulse) {
          gp.hapticActuators[0].pulse(strong, duration).catch(() => {});
        }
      }
    }

    /* =========================================================================
       GAMEPAD POLLING ENGINE (Xbox standard layout mapping + Analog Deadzones)
       ========================================================================= */
    const STICK_DEADZONE = 0.35;
    let prevPadButtons = [];
    let prevPadAxes = { x: 0, y: 0 };

    function pollGamepads() {
      if (!navigator.getGamepads) return;
      const gamepads = navigator.getGamepads();
      let activePad = null;

      for (let i = 0; i < gamepads.length; i++) {
        if (gamepads[i] && gamepads[i].connected) {
          activePad = gamepads[i];
          break;
        }
      }

      if (activePad) {
        writeText(padEl, 'pad', 'PAD 1');
        padEl.classList.add('connected');
        unlockAchievement('pad_warrior');

        const b = activePad.buttons;
        const axes = activePad.axes;

        // Button press helper with rising-edge latching
        const isPressed = (idx) => b[idx] && (b[idx].pressed || b[idx].value > 0.5);
        const wasPressed = (idx) => !!prevPadButtons[idx];

        // Standard Xbox Mapping:
        // D-Pad: 12 (Up), 13 (Down), 14 (Left), 15 (Right)
        // Face buttons: 0 (A), 1 (B), 2 (X), 3 (Y), 9 (Start), 8 (Back/View)
        // Left Stick: Axes 0 (X), Axes 1 (Y)
        // Right Stick: Axes 2 (X), Axes 3 (Y)

        // Every direction edge seen this frame, in order. A single slot let a
        // stick edge overwrite a d-pad edge from the same poll; handleAction
        // dedupes and queues, so dispatching several is safe.
        const dirEdges = [];

        // D-Pad checks (rising edge)
        if (isPressed(12) && !wasPressed(12)) dirEdges.push('ArrowUp');
        if (isPressed(13) && !wasPressed(13)) dirEdges.push('ArrowDown');
        if (isPressed(14) && !wasPressed(14)) dirEdges.push('ArrowLeft');
        if (isPressed(15) && !wasPressed(15)) dirEdges.push('ArrowRight');

        // Left Thumbstick checks with deadzone latching
        const stickX = axes[0] !== undefined ? axes[0] : 0;
        const stickY = axes[1] !== undefined ? axes[1] : 0;

        // Dominant axis wins, so a diagonal flick still reads as one turn.
        let stickDir = null;
        if (Math.abs(stickX) > STICK_DEADZONE || Math.abs(stickY) > STICK_DEADZONE) {
          if (Math.abs(stickX) > Math.abs(stickY)) {
            if (stickX > STICK_DEADZONE && prevPadAxes.x <= STICK_DEADZONE) stickDir = 'ArrowRight';
            else if (stickX < -STICK_DEADZONE && prevPadAxes.x >= -STICK_DEADZONE) stickDir = 'ArrowLeft';
          } else {
            if (stickY > STICK_DEADZONE && prevPadAxes.y <= STICK_DEADZONE) stickDir = 'ArrowDown';
            else if (stickY < -STICK_DEADZONE && prevPadAxes.y >= -STICK_DEADZONE) stickDir = 'ArrowUp';
          }
        }
        if (stickDir) dirEdges.push(stickDir);

        prevPadAxes.x = stickX;
        prevPadAxes.y = stickY;

        // Start / A / X button to start or respawn
        if ((isPressed(0) && !wasPressed(0)) || (isPressed(9) && !wasPressed(9)) || (isPressed(2) && !wasPressed(2))) {
          if (gameOver || !gameStarted) {
            handleAction('Enter');
            rumbleGamepad(150, 0.4, 0.4);
          }
        }

        for (let d = 0; d < dirEdges.length; d++) {
          handleAction(dirEdges[d]);
        }

        // Cache button state for edge detection
        // Reused in place; this runs every frame while a pad is connected.
        prevPadButtons.length = b.length;
        for (let j = 0; j < b.length; j++) {
          prevPadButtons[j] = isPressed(j);
        }
      } else {
        writeText(padEl, 'pad', 'OFF');
        padEl.classList.remove('connected');
      }
    }

    window.addEventListener('gamepadconnected', (e) => {
      unlockAchievement('pad_warrior');

    const feverFill = document.getElementById('fever-fill');
    const feverTxt = document.getElementById('fever-txt');
    const rig = document.getElementById('rig-container');
    const screamer = document.getElementById('screamer-text');
    const apocOverlay = document.getElementById('apocalypse-overlay');
    const superFlash = document.getElementById('super-flash');

    const GRID_SIZE = 27;
    const TILE_COUNT = canvas.width / GRID_SIZE; // 20x20
    // Tick interval at 100% speed, in ms. Larger is slower.
    const BASE_SPEED = 116;
    // Floor on the tick interval, so the speed curve can't outrun human reaction.
    const MIN_TICK_MS = 42;
    // How the tick rate ramps. Score used to divide by 400, which saturated the
    // whole curve within about fifteen pickups once big food started landing.
    const SPEED_PER_SCORE = 0.35 / 650;
    const SPEED_PER_COMBO = 0.06;
    const SPEED_FEVER_BONUS = 0.6;
    const MAX_SPEED_SCALE = 2.8;

    let snake = [];
    let direction = { x: 0, y: 0 };
    // Pending turns, oldest first; a logic tick consumes one. A queue rather
    // than a single next-direction slot is what keeps both halves of a fast
    // zig-zag when they land inside the same tick window (42-116ms).
    const turnQueue = [];
    const MAX_QUEUED_TURNS = 2;
    let foods = []; // Multi-food arsenal: normal, super, nuke, blackhole, laser
    let score = 0;
    let combo = 0;
    let lastEatTimestamp = 0;
    const COMBO_WINDOW = 3500;
    let highScore = Number(storageGet('hyper_snake_omega_hi')) || 0;
    let gameOver = false;
    let gameStarted = false;

    // FEVER / OVERDRIVE SYSTEM
    let feverEnergy = 0; // 0 to 100
    let feverActive = false;
    let feverTimeLeft = 0;
    let feverDuration = 8000;

    /* -------------------------------------------------------------------------
       Glow sprites. Drawing every particle as an arc with ctx.shadowBlur made the
       particle pass the hot spot of the whole renderer: a nuke spawns 160 of them
       in one frame and each blur is a separate full filter pass. Instead we bake
       one radial-gradient sprite per colour and blit it with 'lighter', which is
       the same look for a fraction of the cost.
       ------------------------------------------------------------------------- */
    const GLOW_SPRITE_SIZE = 64;
    const glowSprites = new Map();

    function getGlowSprite(color) {
      let sprite = glowSprites.get(color);
      if (sprite) return sprite;

      sprite = document.createElement('canvas');
      sprite.width = GLOW_SPRITE_SIZE;
      sprite.height = GLOW_SPRITE_SIZE;
      const sctx = sprite.getContext('2d');
      const c = GLOW_SPRITE_SIZE / 2;
      const grad = sctx.createRadialGradient(c, c, 0, c, c, c);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.22, color);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      sctx.fillStyle = grad;
      sctx.fillRect(0, 0, GLOW_SPRITE_SIZE, GLOW_SPRITE_SIZE);

      glowSprites.set(color, sprite);
      return sprite;
    }

    // Exact colour for the solid body, so the rainbow gradient down the snake is
    // unchanged. The glow behind it uses a hue rounded to 10deg, which keeps the
    // sprite cache bounded and is imperceptible under an additive blur.
    function segmentColor(i) {
      return feverActive
        ? `hsl(${(rainbowHue + i * 25) % 360}, 100%, 65%)`
        : `hsl(${(rainbowHue + i * 14) % 360}, 100%, 60%)`;
    }

    function segmentGlowColor(i) {
      const hue = (feverActive ? rainbowHue + i * 25 : rainbowHue + i * 14) % 360;
      return `hsl(${Math.round(hue / 10) * 10}, 100%, ${feverActive ? 65 : 60}%)`;
    }

    const FOOD_SYMBOLS = { nuke: '☢', blackhole: '✦', laser: '⚡' };

    /* -------------------------------------------------------------------------
       Bloom. The scene is downsampled into a chain of small buffers and composited
       back additively, which is the cheapest real blur there is: the hardware does
       it during the scale. Each step halves, because jumping straight to a fifth
       aliases badly and shows up as banding across the sprites.

       Level 0 is only a filtering intermediate. Level 1 is the tight halo, level 2
       the wide one, and the wide one is folded into the tight buffer while it is
       still 135px across rather than composited separately at full size. That
       matters: measured on this canvas the downsample chain is 0.85ms and each
       full-resolution upscale is 1.8-3.9ms, so doing one instead of two is most of
       the pass. Software rasteriser numbers; on a GPU all of it is close to free.
       ------------------------------------------------------------------------- */
    const BLOOM_LEVELS = [];
    const BLOOM_TIGHT = 1;
    const BLOOM_WIDE = 2;
    const BLOOM_STRENGTH = 0.5;    // weight of the combined halo over the scene
    const BLOOM_WIDE_MIX = 0.6;    // how much of that halo comes from the wide level

    (function buildBloomChain() {
      let w = canvas.width, h = canvas.height;
      for (let i = 0; i <= BLOOM_WIDE; i++) {
        w = Math.max(1, Math.round(w / 2));
        h = Math.max(1, Math.round(h / 2));
        const buf = document.createElement('canvas');
        buf.width = w;
        buf.height = h;
        BLOOM_LEVELS.push({ canvas: buf, ctx: buf.getContext('2d') });
      }
    })();

    function applyBloom() {
      let src = canvas;
      for (const lvl of BLOOM_LEVELS) {
        lvl.ctx.clearRect(0, 0, lvl.canvas.width, lvl.canvas.height);
        lvl.ctx.drawImage(src, 0, 0, lvl.canvas.width, lvl.canvas.height);
        src = lvl.canvas;
      }

      const tight = BLOOM_LEVELS[BLOOM_TIGHT];
      const wide = BLOOM_LEVELS[BLOOM_WIDE];

      tight.ctx.save();
      tight.ctx.globalCompositeOperation = 'lighter';
      tight.ctx.globalAlpha = BLOOM_WIDE_MIX;
      tight.ctx.drawImage(wide.canvas, 0, 0, tight.canvas.width, tight.canvas.height);
      tight.ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = BLOOM_STRENGTH;
      ctx.drawImage(tight.canvas, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    // SPECIAL VISUAL FX ARRAYS
    let particles = [];
    let shockwaves = [];
    let floatingTexts = [];
    let lightningBolts = [];
    let cosmicLasers = [];
    // Collapsing singularities left behind by a black hole pickup. Purely visual:
    // they bend particles, not gameplay.
    let gravityWells = [];
    // Tuned so matter seeded at ~150px orbits just below escape velocity and
    // spirals in over roughly a second.
    const GRAVITY_G = 3400;
    const GRAVITY_MIN_DIST = 24;
    const GRAVITY_MAX_ACCEL = 6;
    // Timers from the death animation, cleared on reset so a restart mid-explosion
    // doesn't spray the old snake's debris across the new game.
    let deathTimers = [];

    // Camera & Screen Distortions
    let screenShake = 0;
    // RGB split, in pixels, applied to the whole rig as a pair of drop-shadows.
    // Spiked by the heavy pickups and by death, then decayed like the flash.
    let chromaticAberration = 0;
    let cameraZoom = 1;
    let cameraRotate = 0;
    let flashIntensity = 0;
    let rainbowHue = 0;
    // Position of the swallow travelling head to tail, as a segment index.
    // Negative means nothing in flight.
    let eatPulse = -1;
    let lastTick = 0;
    let lastFrame = 0;
    const FRAME_MS = 1000 / 60;   // every FX constant below was tuned at 60fps
    const MAX_FRAME_MS = 100;     // clamp so a backgrounded tab doesn't jump on return

    bestEl.textContent = highScore;

    function resetGame() {
      deathTimers.forEach(clearTimeout);
      deathTimers = [];

      // Death leaves the camera mid-shake at zoom 1.3 / rotate 0.3; without this
      // the fresh game starts inside the old explosion.
      run = newRun();

      screenShake = 0;
      flashIntensity = 0;
      chromaticAberration = 0;
      eatPulse = -1;
      cameraZoom = 1;
      cameraRotate = 0;
      lastTick = performance.now();

      snake = [
        { x: 10, y: 10 },
        { x: 10, y: 11 },
        { x: 10, y: 12 },

      ];

      turnQueue.length = 0;

      comboEl.textContent = '1.0x';
